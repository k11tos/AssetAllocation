name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/assetallocation:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Add Raspberry Pi host key
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_PORT: ${{ secrets.PI_PORT }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PI_PORT" "$PI_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy updated image on Raspberry Pi
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_PORT: ${{ secrets.PI_PORT }}
        run: |
          ssh -p "$PI_PORT" "$PI_USER@$PI_HOST" \
            IMAGE_NAME="$IMAGE_NAME" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            GHCR_USERNAME="$GHCR_USERNAME" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            'bash -se' <<'EOF'
            set -eu
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            # Refresh image availability only; recurring execution remains host-scheduled.
            ASSET_ALLOCATION_IMAGE="$IMAGE_NAME" docker compose pull asset-allocation
          EOF

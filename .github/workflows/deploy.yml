name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/assetallocation:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up old untagged GHCR versions
        if: ${{ success() && github.ref == 'refs/heads/master' && steps.build_push.outcome == 'success' }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: assetallocation
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: true

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}
          log-public-key: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Tailscale diagnostics
        run: |
          tailscale status
          tailscale ip -4

      - name: Add Raspberry Pi host key
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          ssh-keyscan "$PI_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy updated image on Raspberry Pi
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          set -eu
          IMAGE_NAME_Q=$(printf '%q' "$IMAGE_NAME")
          DEPLOY_PATH_Q=$(printf '%q' "$DEPLOY_PATH")
          GHCR_USERNAME_Q=$(printf '%q' "$GHCR_USERNAME")
          GHCR_TOKEN_Q=$(printf '%q' "$GHCR_TOKEN")
          timeout 10m ssh -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 "$PI_USER@$PI_HOST" \
            'bash -se' <<EOF
            set -eu
            export IMAGE_NAME=$IMAGE_NAME_Q
            export DEPLOY_PATH=$DEPLOY_PATH_Q
            export GHCR_USERNAME=$GHCR_USERNAME_Q
            export GHCR_TOKEN=$GHCR_TOKEN_Q

            test -d "$DEPLOY_PATH" || { echo "Deployment target directory is missing"; exit 1; }
            cd "$DEPLOY_PATH"

            if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ] || [ -f compose.yml ] || [ -f compose.yaml ]; then
              echo "Deployment compose file verified"
            else
              echo "Deployment compose file is missing"
              exit 1
            fi

            echo "Docker deployment target verified"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            # Refresh image availability only; recurring execution remains host-scheduled.
            ASSET_ALLOCATION_IMAGE="$IMAGE_NAME" docker compose pull asset-allocation
            docker compose ps
          EOF

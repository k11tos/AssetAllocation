[project]
name = "asset-allocation"
version = "0.1.0"
description = "Asset allocation strategies with multiple portfolio management approaches"
authors = [
    {name = "Asset Allocation Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.8",
    "yfinance>=1.7.0",
    "fredapi>=0.5.2",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "ta-lib>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pre-commit>=4.3.0",
]

[project.scripts]
asset-allocation = "main:main"
asset-cli = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["strategies", "services", "utils"]
[tool.black]
line-length = 79
target-version = ['py311']          # ← 기존 'py36'에서 업그레이드
include = '\.pyi?$'
extend-exclude = '''                # ← 기본 exclude에 추가로 합산
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
py_version = 311                    # ← 기존 36 → 312
multi_line_output = 3               # (black 프로필에 포함되지만 명시 유지)

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "coverage>=7.10.6",
    "mypy>=1.18.2",
    "pylint>=4.0.7",
    "pytest>=9.0.3",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.15.0",
    "radon>=6.0.1",
    "safety>=3.8.1",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.13.5",
    "sphinx-rtd-theme>=3.0.2",
]
